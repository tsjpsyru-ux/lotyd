  <script>
    var pixelData = '{}';
    pixelData = JSON.parse(pixelData);
    // to load the given script asynchronously.
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
          var s;
          s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
      });
    }
    // function to hit the google tag.
    async function googleTagScript(w, id) {
      await loadScript(`https://www.googletagmanager.com/gtag/js?id=${id}`)
      w.dataLayer = w.dataLayer || [];
      const gtag = () => dataLayer.push(arguments);
      gtag('js', new Date());
      gtag('config', id);
    }
    // function to hit the meta pixel.
    const metaPixelScript = async (id, callback) => {
      await loadScript(`https://www.facebook.com/tr?id=${id}&ev=PageView&noscript=1`)
      !function(f,b,e,v,n,t,s){
          if(f.fbq) return;
          n = f.fbq = function(){
              n.callMethod? n.callMethod.apply(n,arguments) : n.queue.push(arguments)
          };
          
          if(!f._fbq) f._fbq = n; 
          n.push = n;
          n.loaded = !0;
          n.version = '2.0';
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)
      }(window, document,'script', 'https://connect.facebook.net/en_US/fbevents.js'); 
      fbq('init', Number(id)); 
      callback(fbq);
    }
    // GLOBAL
    const EVENT_MAP = {
      link: "LINK_VISIT",
      brand: "BRAND_VISIT",
      campaign: "CAMPAIGN_VISIT",
      agency: "AGENCY_VISIT"
    };
    // handles individual hit
    const handleHits = async (hl) => {
      if (!hl?.length) return;
      
      const pixel_id = hl[0]['pixel_id']
      const pixel_type = hl[0]['pixel_type'];
      
      if (pixel_type === 'META') {
          await metaPixelScript(pixel_id, (fbq) => {
              hl.forEach(item => {
                  const event = EVENT_MAP[item?.key];
                  const payload = { level: item?.key };
                  fbq('trackCustom', event, payload);
              });
          })
      } else await googleTagScript(window, pixel_id);
    }
    // function to iterate over each pixel and hit it according to its type.
    const hitPixels = (pixelData) => {
      const vals = Object.keys(pixelData)
      .map(key => {
          const value = pixelData[key];
          return {key, ...value }
      });
      
      // gathers pixels with same pixel_ids
      const PIXEL_LOOKUP = {};
      for (let i = 0; i < vals.length; i++) {
          const val = vals[i];
          const pixelId = val['pixel_id'];
          if (!PIXEL_LOOKUP[pixelId]) {
              PIXEL_LOOKUP[pixelId] = [val];
          } else {
              PIXEL_LOOKUP[pixelId] = [...PIXEL_LOOKUP[pixelId], val];
          }
      }
      Object.values(PIXEL_LOOKUP).forEach(handleHits);
    }
    if(continent?.toLowerCase() !== 'eu') {
      hitPixels(pixelData);
    }
